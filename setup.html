<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Setup · Tile City</title>
  <link rel="stylesheet" href="css/tiles.css">
  <style>
    .setup {
      margin-top: 36px;
      max-width: 28rem;
    }

    .setup h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 5vw, 40px);
      letter-spacing: 0.04em;
    }

    .setup .lead {
      margin: 0 0 22px;
      font-size: 15px;
      color: #5a4a38;
    }

    .player-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .player-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
      align-items: center;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
    }

    .player-row input[type="text"] {
      width: 100%;
      min-width: 0;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font: inherit;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .color-picks {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      max-width: 9.5rem;
      justify-content: flex-end;
    }

    .color-picks button {
      width: 22px;
      height: 22px;
      padding: 0;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      background: var(--swatch);
    }

    .color-picks button.on {
      border-color: #1a1a1a;
      box-shadow: 0 0 0 2px #fff, 0 0 0 3px #1a1a1a;
    }

    .color-picks button:disabled {
      opacity: 0.28;
      cursor: not-allowed;
    }

    .remove-player {
      width: 2.2em;
      height: 2.2em;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fffaf1;
      color: #8a3a2a;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .remove-player:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .setup-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    .setup-actions.top-actions {
      margin: 0 0 12px;
    }

    .color-picks button[data-color="white"] {
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.28);
    }

    .setup-actions button,
    .setup-actions a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 7.5rem;
      padding: 11px 18px;
      border-radius: 999px;
      font: inherit;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-decoration: none;
      cursor: pointer;
    }

    .setup-actions .add {
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
    }

    .setup-actions .add:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .setup-actions .start {
      color: #fffdf8;
      background: var(--city);
      border: 1px solid #9e3422;
      box-shadow: 0 8px 20px rgba(196, 71, 50, 0.22);
    }

    .setup-actions .back {
      color: var(--ink);
      background: transparent;
      border: 1px solid transparent;
    }

    .hint {
      margin: 12px 0 0;
      font-size: 13px;
      color: #7a6a58;
    }

    .err {
      margin: 10px 0 0;
      color: #b42318;
      font-size: 14px;
      font-weight: 700;
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="page-top">
      <div></div>
      <div class="lang-bar" role="group" aria-label="Language">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="ja">JA</button>
      </div>
    </div>
    <div class="setup">
      <h1 data-i18n="setupTitle">Players</h1>
      <p class="lead" data-i18n="setupLead">2–8 players. Name max 6 letters. Each color once.</p>
      <div class="setup-actions top-actions">
        <button type="button" class="add" id="add-player" data-i18n="addPlayer">Add player</button>
      </div>
      <ul class="player-list" id="player-list"></ul>
      <p class="err" id="err" aria-live="polite"></p>
      <div class="setup-actions">
        <button type="button" class="start" id="start-game" data-i18n="start">Start</button>
        <a class="back" href="index.html" data-i18n="back">Back</a>
      </div>
      <p class="hint" id="count-hint"></p>
    </div>
  </div>
  <script src="js/game.js"></script>
  <script src="js/i18n.js"></script>
  <script>
    const SETUP_KEY = "tile-city-setup";
    const palette = Carcassonne.COLOR_PALETTE;
    const min = Carcassonne.PLAYERS_MIN;
    const max = Carcassonne.PLAYERS_MAX;
    const nameMax = Carcassonne.NAME_MAX;

    function defaultRoster() {
      return Carcassonne.PLAYERS.map((player) => ({ id: player.id, name: player.name }));
    }

    function load() {
      try {
        const raw = sessionStorage.getItem(SETUP_KEY);
        if (raw) return Carcassonne.normalizePlayers(JSON.parse(raw));
      } catch (err) {}
      return defaultRoster();
    }

    let players = load();

    function usedColors(exceptIndex) {
      const used = new Set();
      players.forEach((player, index) => {
        if (index === exceptIndex) return;
        used.add(player.id);
      });
      return used;
    }

    function nextFreeColor() {
      const used = usedColors(-1);
      return palette.find((color) => !used.has(color.id));
    }

    function setErr(msg) {
      document.getElementById("err").textContent = msg || "";
    }

    function paint() {
      const list = document.getElementById("player-list");
      const canRemove = players.length > min;
      const lang = TileCityI18n.getLang();
      list.innerHTML = players.map((player, index) => {
        const used = usedColors(index);
        const swatches = palette.map((color) => {
          const taken = used.has(color.id);
          const on = color.id === player.id ? " on" : "";
          const disabled = taken && color.id !== player.id ? " disabled" : "";
          return '<button type="button" class="' + on.trim() + '" data-color="' + color.id +
            '" data-index="' + index + '" style="--swatch:' + color.hex + '"' + disabled +
            ' aria-label="' + TileCityI18n.colorLabel(color.id, lang) + '"></button>';
        }).join("");
        return '<li class="player-row" data-index="' + index + '">' +
          '<input type="text" maxlength="' + nameMax + '" value="' + player.name.replace(/"/g, "&quot;") +
          '" data-name="' + index + '" aria-label="' + TileCityI18n.t("playerName", lang) + '">' +
          '<div class="color-picks">' + swatches + "</div>" +
          '<button type="button" class="remove-player" data-remove="' + index + '"' +
          (canRemove ? "" : " disabled") + ' aria-label="' + TileCityI18n.t("removePlayer", lang) +
          '">×</button></li>';
      }).join("");
      document.getElementById("add-player").disabled = players.length >= max || !nextFreeColor();
      document.getElementById("count-hint").textContent =
        TileCityI18n.t("playersCount", lang, { n: players.length, max: max });
    }

    document.getElementById("player-list").addEventListener("input", (event) => {
      const input = event.target.closest("[data-name]");
      if (!input) return;
      const index = Number(input.getAttribute("data-name"));
      players[index].name = input.value.slice(0, nameMax);
      setErr("");
    });

    document.getElementById("player-list").addEventListener("click", (event) => {
      const colorBtn = event.target.closest("[data-color]");
      if (colorBtn && !colorBtn.disabled) {
        const index = Number(colorBtn.getAttribute("data-index"));
        players[index].id = colorBtn.getAttribute("data-color");
        setErr("");
        paint();
        return;
      }
      const remove = event.target.closest("[data-remove]");
      if (remove && !remove.disabled) {
        players.splice(Number(remove.getAttribute("data-remove")), 1);
        setErr("");
        paint();
      }
    });

    document.getElementById("add-player").addEventListener("click", () => {
      if (players.length >= max) return;
      const color = nextFreeColor();
      if (!color) return;
      players.push({
        id: color.id,
        name: TileCityI18n.colorLabel(color.id).slice(0, nameMax),
      });
      setErr("");
      paint();
    });

    document.getElementById("start-game").addEventListener("click", () => {
      const lang = TileCityI18n.getLang();
      const cleaned = players.map((player) => ({
        id: player.id,
        name: (player.name || "").trim().slice(0, nameMax) ||
          TileCityI18n.colorLabel(player.id, lang).slice(0, nameMax),
      }));
      const ids = cleaned.map((player) => player.id);
      if (cleaned.length < min || cleaned.length > max) {
        setErr(TileCityI18n.t("errNeedPlayers", lang, { min: min, max: max }));
        return;
      }
      if (new Set(ids).size !== ids.length) {
        setErr(TileCityI18n.t("errUniqueColor", lang));
        return;
      }
      try {
        localStorage.removeItem("tile-city-save");
      } catch (err) {}
      sessionStorage.setItem(SETUP_KEY, JSON.stringify(cleaned));
      location.href = "play.html";
    });

    TileCityI18n.bindLangBar(() => {
      setErr("");
      paint();
    });
    paint();
  </script>
</body>
</html>
