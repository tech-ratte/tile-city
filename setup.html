<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Setup · Tile City</title>
  <link rel="stylesheet" href="css/tiles.css">
  <style>
    .setup {
      margin: 36px auto 0;
      max-width: 36rem;
      text-align: center;
    }

    .setup h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 5vw, 40px);
      letter-spacing: 0.04em;
    }

    .setup .lead {
      margin: 0 auto 22px;
      max-width: 24rem;
      font-size: 15px;
      color: #5a4a38;
      line-height: 1.55;
    }

    .setup .lead .lead-bot {
      display: block;
      margin-top: 0.2em;
    }

    .player-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .player-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto auto;
      gap: 8px;
      align-items: center;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
      text-align: left;
    }

    .player-row input[type="text"] {
      width: 100%;
      min-width: 0;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font: inherit;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-align: center;
    }

    .player-kind {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 6.5rem;
    }

    .player-kind select {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      background: #fffaf1;
      color: var(--ink);
    }

    /* Desktop: hide strength when human. Mobile keeps the slot (see media query). */
    .strength-label.is-idle {
      display: none;
    }

    .player-row.is-bot {
      background: #fff7ea;
    }

    .player-row.is-bot input[type="text"] {
      background: #f0e6d8;
      color: #5a4a38;
      cursor: default;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 560px) {
      .player-row {
        grid-template-columns: minmax(0, 1fr) auto auto;
        grid-template-areas:
          "name kind remove"
          "colors colors colors";
        column-gap: 8px;
        row-gap: 8px;
      }

      .player-row input[type="text"] { grid-area: name; }
      .player-kind {
        grid-area: kind;
        flex-direction: row;
        flex-wrap: nowrap;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }
      .player-kind .kind-label,
      .player-kind .strength-label {
        flex: none;
        width: 4.75rem;
      }
      .player-kind select {
        width: 100%;
        min-width: 0;
        box-sizing: border-box;
      }
      /* Reserve strength width so the name field stays the same as bot mode. */
      .strength-label.is-idle {
        display: block;
        visibility: hidden;
        pointer-events: none;
      }
      .color-picks {
        grid-area: colors;
        justify-content: flex-start;
        align-self: center;
      }
      .remove-player { grid-area: remove; }
    }

    .color-picks {
      display: flex;
      flex-wrap: nowrap;
      gap: 4px;
      justify-content: flex-end;
      flex-shrink: 0;
    }

    .color-picks button {
      flex: none;
      width: 22px;
      height: 22px;
      padding: 0;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      background: var(--swatch);
    }

    .color-picks button.on {
      border-color: #1a1a1a;
      box-shadow: 0 0 0 2px #fff, 0 0 0 3px #1a1a1a;
    }

    .color-picks button:disabled {
      opacity: 0.28;
      cursor: not-allowed;
    }

    .remove-player {
      width: 2.2em;
      height: 2.2em;
      border: 1px solid #9e3422;
      border-radius: 8px;
      background: var(--city);
      color: #fffdf8;
      font: inherit;
      font-size: 18px;
      font-weight: 800;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(196, 71, 50, 0.28);
    }

    .remove-player:hover:not(:disabled) {
      filter: brightness(1.06);
    }

    .remove-player:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      box-shadow: none;
    }

    .setup-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
      justify-content: center;
    }

    .setup-actions.top-actions {
      margin: 0 0 12px;
    }

    .color-picks button[data-color="white"] {
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.28);
    }

    .setup-actions button,
    .setup-actions a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 7.5rem;
      padding: 11px 18px;
      border-radius: 999px;
      font: inherit;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-decoration: none;
      cursor: pointer;
    }

    .setup-actions .add {
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
    }

    .setup-actions .add:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .setup-actions .start {
      color: #fffdf8;
      background: var(--city);
      border: 1px solid #9e3422;
      box-shadow: 0 8px 20px rgba(196, 71, 50, 0.22);
    }

    .setup-actions .back {
      color: var(--ink);
      background: transparent;
      border: 1px solid transparent;
    }

    .hint {
      margin: 12px 0 0;
      font-size: 13px;
      color: #7a6a58;
    }

    .err {
      margin: 10px 0 0;
      color: #b42318;
      font-size: 14px;
      font-weight: 700;
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="page-top">
      <div></div>
      <div class="chrome-controls">
        <label class="volume-bar" data-i18n-aria="volumeLabel" aria-label="Volume">
          <svg class="volume-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1-3.29-2.5-4.03v8.05c1.5-.74 2.5-2.26 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
          <input class="volume-range" type="range" min="0" max="100" step="1" value="70">
        </label>
        <div class="lang-bar" role="group" aria-label="Language">
          <button type="button" data-lang="en">EN</button>
          <button type="button" data-lang="ja">JA</button>
        </div>
      </div>
    </div>
    <div class="setup">
      <h1 data-i18n="setupTitle">Players</h1>
      <p class="lead">
        <span data-i18n="setupLead">2–8 players. Name max 10 letters. Each color once.</span>
        <span class="lead-bot" data-i18n="setupLeadBot">Bots play automatically.</span>
      </p>
      <div class="setup-actions top-actions">
        <button type="button" class="add" id="add-player" data-i18n="addPlayer">Add player</button>
      </div>
      <ul class="player-list" id="player-list"></ul>
      <p class="err" id="err" aria-live="polite"></p>
      <div class="setup-actions">
        <button type="button" class="start" id="start-game" data-i18n="start">Start</button>
        <a class="back" href="index.html" data-i18n="back">Back</a>
      </div>
      <p class="hint" id="count-hint"></p>
    </div>
  </div>
  <script src="js/setup.bundle.js"></script>

</body>
</html>
