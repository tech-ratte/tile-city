<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Setup · Tile City</title>
  <link rel="stylesheet" href="css/tiles.css">
  <style>
    .setup {
      margin-top: 36px;
      max-width: 28rem;
    }

    .setup h1 {
      margin: 0 0 8px;
      font-size: clamp(28px, 5vw, 40px);
      letter-spacing: 0.04em;
    }

    .setup .lead {
      margin: 0 0 22px;
      font-size: 15px;
      color: #5a4a38;
    }

    .player-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .player-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
      align-items: center;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
    }

    .player-row input[type="text"] {
      width: 100%;
      min-width: 0;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font: inherit;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .color-picks {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      max-width: 9.5rem;
      justify-content: flex-end;
    }

    .color-picks button {
      width: 22px;
      height: 22px;
      padding: 0;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      background: var(--swatch);
    }

    .color-picks button.on {
      border-color: #1a1a1a;
      box-shadow: 0 0 0 2px #fff, 0 0 0 3px #1a1a1a;
    }

    .color-picks button:disabled {
      opacity: 0.28;
      cursor: not-allowed;
    }

    .remove-player {
      width: 2.2em;
      height: 2.2em;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fffaf1;
      color: #8a3a2a;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .remove-player:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .setup-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 18px;
    }

    .setup-actions.top-actions {
      margin: 0 0 12px;
    }

    .color-picks button[data-color="white"] {
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.28);
    }

    .setup-actions button,
    .setup-actions a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 7.5rem;
      padding: 11px 18px;
      border-radius: 999px;
      font: inherit;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-decoration: none;
      cursor: pointer;
    }

    .setup-actions .add {
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
    }

    .setup-actions .add:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .setup-actions .start {
      color: #fffdf8;
      background: var(--city);
      border: 1px solid #9e3422;
      box-shadow: 0 8px 20px rgba(196, 71, 50, 0.22);
    }

    .setup-actions .back {
      color: var(--ink);
      background: transparent;
      border: 1px solid transparent;
    }

    .hint {
      margin: 12px 0 0;
      font-size: 13px;
      color: #7a6a58;
    }

    .err {
      margin: 10px 0 0;
      color: #b42318;
      font-size: 14px;
      font-weight: 700;
      min-height: 1.2em;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="page-top">
      <div></div>
      <div class="lang-bar" role="group" aria-label="Language">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="ja">JA</button>
      </div>
    </div>
    <div class="setup">
      <h1 data-i18n="setupTitle">Players</h1>
      <p class="lead" data-i18n="setupLead">2–8 players. Name max 6 letters. Each color once.</p>
      <div class="setup-actions top-actions">
        <button type="button" class="add" id="add-player" data-i18n="addPlayer">Add player</button>
      </div>
      <ul class="player-list" id="player-list"></ul>
      <p class="err" id="err" aria-live="polite"></p>
      <div class="setup-actions">
        <button type="button" class="start" id="start-game" data-i18n="start">Start</button>
        <a class="back" href="index.html" data-i18n="back">Back</a>
      </div>
      <p class="hint" id="count-hint"></p>
    </div>
  </div>
  <script src="js/setup.bundle.js"></script>

</body>
</html>
