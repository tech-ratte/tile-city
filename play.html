<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TileCity</title>
  <meta name="description" content="道と都市を広げて得点を競うタイル配置ゲーム。">
  <meta name="theme-color" content="#142018">
  <link rel="icon" href="assets/icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="assets/icons/favicon-48.png" type="image/png" sizes="48x48">
  <link rel="icon" href="assets/icons/favicon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" sizes="180x180">
  <link rel="manifest" href="site.webmanifest">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://tech-ratte.github.io/tile-city/play.html">
  <meta property="og:site_name" content="TileCity">
  <meta property="og:title" content="TileCity">
  <meta property="og:description" content="道と都市を広げて得点を競うタイル配置ゲーム。">
  <meta property="og:image" content="https://tech-ratte.github.io/tile-city/assets/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="TileCity">
  <meta name="twitter:description" content="道と都市を広げて得点を競うタイル配置ゲーム。">
  <meta name="twitter:image" content="https://tech-ratte.github.io/tile-city/assets/og.png">
  <link rel="canonical" href="https://tech-ratte.github.io/tile-city/play.html">
  <script>
    (function () {
      var ua = navigator.userAgent || "";
      var phone = /iPhone|iPod/i.test(ua);
      var pad = /iPad/i.test(ua) || (!phone && navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      var narrow = matchMedia("(max-width: 1024px)").matches;
      var classicPad = matchMedia("(min-width: 768px) and (max-width: 1024px) and (min-height: 700px)").matches;
      if (phone) {
        document.documentElement.classList.add("is-overlay");
        return;
      }
      if (pad || classicPad) document.documentElement.classList.add("is-pad");
      if (pad || classicPad || narrow) document.documentElement.classList.add("is-overlay");
    })();
  </script>
  <link rel="stylesheet" href="css/tiles.css">
  <link rel="stylesheet" href="css/play.css">

</head>
<body>
  <div class="wrap">
    <div class="play">
      <div class="board-panel">
        <div id="legend"></div>
        <div class="scroller" id="scroller">
          <div class="board-grid" id="grid"></div>
        </div>
        <div id="discard-overlay" class="discard-overlay" hidden>
          <div class="discard-card" id="overlay-card">
            <button type="button" id="minimize-ranking" class="minimize-ranking" hidden data-i18n-aria="boardView" data-i18n-title="boardView" aria-label="Board" title="Board">
              <span class="min-ico" aria-hidden="true"></span>
            </button>
            <p id="overlay-message">No legal place for this tile</p>
            <div id="ranking-root" hidden></div>
            <div id="ranking-actions" class="ranking-actions" hidden>
              <button type="button" id="end-game" class="quit-chip" data-i18n="home">Home</button>
              <button type="button" id="share-ranking" class="share-chip" data-i18n="share">Share</button>
              <button type="button" id="again-game" class="again-chip" data-i18n="again">Again</button>
            </div>
            <div id="overlay-actions">
              <button type="button" id="ok-discard" data-i18n="ok">OK</button>
              <button type="button" id="confirm-exit" hidden data-i18n="endGame">End</button>
              <button type="button" id="cancel-exit" class="secondary" hidden data-i18n="cancel">Cancel</button>
            </div>
          </div>
        </div>
      </div>
      <aside class="side">
        <div class="hud-top">
          <div id="players-root"></div>
          <div id="stats-root"></div>
        </div>
        <div id="hand-root" class="hud-bottom"></div>
        <div class="foot" id="foot-root"></div>
      </aside>
    </div>
  </div>
  <div id="share-sheet" class="share-sheet" hidden>
    <div class="share-sheet-card" role="dialog" aria-modal="true" aria-labelledby="share-sheet-title">
      <button type="button" id="share-sheet-close" class="share-sheet-close" data-i18n-aria="cancel" aria-label="Cancel">×</button>
      <h2 id="share-sheet-title" data-i18n="shareTitle">Share ranking</h2>
      <p class="share-sheet-lead" data-i18n="shareLead">Share the ranking text and a link to TileCity.</p>
      <pre id="share-preview-text" class="share-preview-text"></pre>
      <p id="share-status" class="share-status" hidden></p>
      <div class="share-actions-primary">
        <button type="button" id="share-native" class="share-primary" data-i18n="shareNative">Share…</button>
        <button type="button" id="share-copy" class="share-secondary" data-i18n="shareCopy">Copy text</button>
      </div>
      <div class="share-sns" role="group" data-i18n-aria="shareSns" aria-label="Social">
        <a id="share-x" class="share-sns-btn" target="_blank" rel="noopener noreferrer">X</a>
        <a id="share-line" class="share-sns-btn" target="_blank" rel="noopener noreferrer">LINE</a>
        <a id="share-facebook" class="share-sns-btn" target="_blank" rel="noopener noreferrer">Facebook</a>
        <a id="share-bluesky" class="share-sns-btn" target="_blank" rel="noopener noreferrer">Bluesky</a>
        <a id="share-threads" class="share-sns-btn" target="_blank" rel="noopener noreferrer">Threads</a>
      </div>
      <div class="share-actions-secondary">
        <button type="button" id="share-copy-url" class="share-text-btn" data-i18n="shareCopyUrl">Copy link</button>
      </div>
    </div>
  </div>
  <script src="js/play.bundle.js"></script>

</body>
</html>
